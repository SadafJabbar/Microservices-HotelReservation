spring.application.name=apigateway
server.port=8090

keycloak-auth-jwt-uri=http://localhost:8084/realms/hotel-reservation/protocol/openid-connect/certs

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8084/realms/hotel-reservation
security.excluded.urls=/swagger-ui/**,/v3/api-docs/**,/docs/**
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=Hotel Service
springdoc.swagger-ui.urls[0].url=/docs/hotelservice/v3/api-docs

springdoc.swagger-ui.urls[1].name=Booking Service
springdoc.swagger-ui.urls[1].url=/docs/bookingservice/v3/api-docs

spring.cloud.gateway.server.webmvc.routes[1].id=booking-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/bookings/**

spring.cloud.gateway.server.webmvc.routes[0].id=hotel-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8080
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/hotelService/**