spring.application.name=BookingService

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3307/hotel_booking_db
spring.datasource.username=${YOUR_USERNAME}
spring.datasource.password=${YOUR_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Kafka

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.producer.properties.spring.json.type.mapping=bookingEvent:bookingservice.event.BookingEvent
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Hotel Service
hotelservice.url=http://localhost:8080/api/v1/hotelService

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

#swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html